<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart City Path Finder - Himachal Pradesh</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #e0f7fa 0%, #b2ebf2 100%);
            overflow-x: hidden;
        }
        .fade-in {
            animation: fadeIn 1s ease-in-out;
        }
        .fade-in-delay {
            animation: fadeIn 1.5s ease-in-out;
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .btn-hover {
            transition: all 0.3s ease;
        }
        .btn-hover:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }
        #map {
            transition: all 0.3s ease;
        }
        #map:hover {
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }
        .input-container {
            position: relative;
        }
        .suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #ddd;
            border-radius: 0 0 8px 8px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        .suggestion-item {
            padding: 10px;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .suggestion-item:hover {
            background: #e0f7fa;
        }
        .distance-label {
            color: red;
            font-weight: bold;
            font-size: 12px;
            background: rgba(255, 255, 255, 0.8);
            padding: 2px 5px;
            border-radius: 3px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center">
    <div class="container max-w-5xl mx-auto p-6">
        <h1 class="text-4xl font-bold text-gray-800 mb-6 fade-in text-center">Smart City Path Finder - Himachal Pradesh</h1>
        <div class="flex flex-col md:flex-row gap-4 mb-8 fade-in-delay justify-center">
            <div class="input-container">
                <input type="text" id="source" placeholder="Enter Origin (e.g., Shimla)" class="w-full md:w-64 p-4 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-cyan-500 shadow-sm" oninput="showSuggestions('source')">
                <div id="source-suggestions" class="suggestions hidden"></div>
            </div>
            <div class="input-container">
                <input type="text" id="destination" placeholder="Enter Destination (e.g., Manali)" class="w-full md:w-64 p-4 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-cyan-500 shadow-sm" oninput="showSuggestions('destination')">
                <div id="destination-suggestions" class="suggestions hidden"></div>
            </div>
            <button onclick="findPath()" class="btn-hover bg-cyan-600 text-white p-4 rounded-lg shadow-md hover:bg-cyan-700">Find Shortest Path</button>
        </div>
        <div id="result" class="bg-white p-6 rounded-lg shadow-lg mb-8 fade-in-delay w-full max-w-2xl mx-auto"></div>
        <div id="map" class="w-full h-[600px] rounded-lg shadow-lg fade-in-delay"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const cities = [
            { name: "Shimla", lat: 31.10483, lng: 77.17339 },
            { name: "Manali", lat: 32.2697, lng: 77.1862 },
            { name: "Dharamshala", lat: 32.2222, lng: 76.3289 },
            { name: "Dalhousie", lat: 32.5458, lng: 76.0022 },
            { name: "Kasauli", lat: 30.9167, lng: 76.9667 },
            { name: "Solan", lat: 30.9258, lng: 77.0944 },
            { name: "Mandi", lat: 31.7106, lng: 76.9522 },
            { name: "Kullu", lat: 31.9917, lng: 77.1333 },
            { name: "Chamba", lat: 32.5500, lng: 76.1167 },
            { name: "Bilaspur", lat: 31.3333, lng: 76.7167 },
            { name: "Baddi", lat: 30.9578, lng: 76.7914 },
            { name: "Nalagarh", lat: 31.0417, lng: 76.7167 },
            { name: "Parwanoo", lat: 30.8372, lng: 76.9614 },
            { name: "Rampur", lat: 31.4494, lng: 77.6321 },
            { name: "Pooh", lat: 31.7578, lng: 78.5958 },
            { name: "Kaza", lat: 32.2250, lng: 78.0667 },
            { name: "Keylong", lat: 32.5833, lng: 77.0333 },
            { name: "Nurpur", lat: 32.3000, lng: 75.9000 },
            { name: "Jawalamukhi", lat: 31.8746, lng: 76.3191 },
            { name: "Kangra", lat: 32.1000, lng: 76.2667 },
            { name: "Palampur", lat: 32.1167, lng: 76.5333 },
            { name: "Baijnath", lat: 32.0500, lng: 76.6500 },
            { name: "Joginder Nagar", lat: 31.9833, lng: 76.7833 },
            { name: "Sundernagar", lat: 31.5333, lng: 76.9000 },
            { name: "Ghumarwin", lat: 31.4333, lng: 76.7167 },
            { name: "Kiratpur Sahib", lat: 31.1833, lng: 76.5667 },
            { name: "Aut", lat: 31.9667, lng: 77.2000 },
            { name: "Pandoh", lat: 31.6667, lng: 77.0500 }
        ];

        const edges = [
            ["Parwanoo", "Solan"],
            ["Solan", "Shimla"],
            ["Shimla", "Rampur"],
            ["Rampur", "Pooh"],
            ["Pooh", "Kaza"],
            ["Kaza", "Manali"],
            ["Manali", "Keylong"],
            ["Baddi", "Nalagarh"],
            ["Nalagarh", "Kiratpur Sahib"],
            ["Kiratpur Sahib", "Bilaspur"],
            ["Bilaspur", "Ghumarwin"],
            ["Ghumarwin", "Sundernagar"],
            ["Sundernagar", "Mandi"],
            ["Mandi", "Pandoh"],
            ["Pandoh", "Aut"],
            ["Aut", "Kullu"],
            ["Kullu", "Manali"],
            ["Nurpur", "Jawalamukhi"],
            ["Jawalamukhi", "Kangra"],
            ["Kangra", "Dharamshala"],
            ["Dharamshala", "Palampur"],
            ["Palampur", "Baijnath"],
            ["Baijnath", "Joginder Nagar"],
            ["Joginder Nagar", "Mandi"],
            ["Dharamshala", "Dalhousie"],
            ["Dalhousie", "Chamba"],
            ["Solan", "Kasauli"]
        ];

        const cityCoords = {};
        cities.forEach(city => {
            cityCoords[city.name] = [city.lat, city.lng];
        });

        var map = L.map('map').setView([31.67, 77.255], 7);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        let edgeLayers = [];
        edges.forEach(([from, to]) => {
            const start = cityCoords[from];
            const end = cityCoords[to];
            if (start && end) {
                const polyline = L.polyline([start, end], {color: 'red', weight: 2}).addTo(map);
                edgeLayers.push(polyline);
            }
        });

        function showSuggestions(inputId) {
            const input = document.getElementById(inputId);
            const suggestionsDiv = document.getElementById(`${inputId}-suggestions`);
            const value = input.value.toLowerCase().trim();

            if (value === "") {
                suggestionsDiv.classList.add("hidden");
                suggestionsDiv.innerHTML = "";
                return;
            }

            const matches = cities.filter(city => city.name.toLowerCase().startsWith(value));
            if (matches.length === 0) {
                suggestionsDiv.classList.add("hidden");
                suggestionsDiv.innerHTML = "";
                return;
            }

            suggestionsDiv.classList.remove("hidden");
            suggestionsDiv.innerHTML = matches.map(city => `
                <div class="suggestion-item" onclick="selectSuggestion('${inputId}', '${city.name}')">${city.name}</div>
            `).join("");
        }

        function selectSuggestion(inputId, value) {
            const input = document.getElementById(inputId);
            const suggestionsDiv = document.getElementById(`${inputId}-suggestions`);
            input.value = value;
            suggestionsDiv.classList.add("hidden");
            suggestionsDiv.innerHTML = "";
        }

        function calculateTravelCost(distance) {
            let cost = 0;
            if (distance <= 10) {
                cost = distance * 5;
            } else if (distance <= 30) {
                cost = (10 * 5) + ((distance - 10) * 2);
            } else {
                cost = (10 * 5) + (20 * 2) + ((distance - 30) * 1);
            }
            return cost.toFixed(2);
        }

        function haversineDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // Earth's radius in km
            const phi1 = lat1 * Math.PI / 180;
            const phi2 = lat2 * Math.PI / 180;
            const deltaPhi = (lat2 - lat1) * Math.PI / 180;
            const deltaLambda = (lon2 - lon1) * Math.PI / 180;

            const a = Math.sin(deltaPhi/2) * Math.sin(deltaPhi/2) +
                      Math.cos(phi1) * Math.cos(phi2) *
                      Math.sin(deltaLambda/2) * Math.sin(deltaLambda/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

            return R * c;
        }

        let currentPathLayer = null;
        let sourceMarker = null;
        let destinationMarker = null;
        let distanceLabels = [];

        async function findPath() {
            const source = document.getElementById('source').value.trim();
            const destination = document.getElementById('destination').value.trim();
            const resultDiv = document.getElementById('result');

            if (!source || !destination) {
                resultDiv.innerHTML = `<p class="text-red-500">Please enter both origin and destination.</p>`;
                clearMap();
                return;
            }

            try {
                const response = await fetch('http://localhost:5000/find_path', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ source, destination })
                });
                const data = await response.json();

                if (data.error) {
                    resultDiv.innerHTML = `<p class="text-red-500">${data.error}</p>`;
                    clearMap();
                } else {
                    const pathText = `Shortest path: ${data.path.join(' → ')}<br>Total distance: ${data.distance.toFixed(2)} km`;
                    const travelCost = calculateTravelCost(data.distance);
                    resultDiv.innerHTML = `
                        <p class="text-gray-800">${pathText}</p>
                        <p class="text-gray-800 mt-2">Travel Cost: ₹${travelCost}</p>
                    `;

                    clearMap();

                    // Add markers for source and destination only
                    const sourceCity = cities.find(city => city.name === source);
                    const destCity = cities.find(city => city.name === destination);
                    if (sourceCity) {
                        sourceMarker = L.marker([sourceCity.lat, sourceCity.lng]).addTo(map)
                            .bindPopup(sourceCity.name);
                    }
                    if (destCity) {
                        destinationMarker = L.marker([destCity.lat, destCity.lng]).addTo(map)
                            .bindPopup(destCity.name);
                    }

                    // Draw the shortest path
                    if (data.path.length > 1) {
                        const pathCoords = data.path.map(city => cityCoords[city]);
                        currentPathLayer = L.polyline(pathCoords, {color: 'blue', weight: 4}).addTo(map);

                        // Add distance labels between consecutive cities in the path
                        for (let i = 0; i < pathCoords.length - 1; i++) {
                            const start = pathCoords[i];
                            const end = pathCoords[i + 1];
                            const distance = haversineDistance(start[0], start[1], end[0], end[1]);
                            const midPoint = [(start[0] + end[0]) / 2, (start[1] + end[1]) / 2];
                            const label = L.divIcon({
                                className: 'distance-label',
                                html: `${distance.toFixed(2)} km`,
                                iconSize: [100, 20]
                            });
                            const labelMarker = L.marker(midPoint, {icon: label}).addTo(map);
                            distanceLabels.push(labelMarker);
                        }

                        // Zoom to fit the path
                        map.fitBounds(pathCoords);
                    }
                }
            } catch (error) {
                resultDiv.innerHTML = `<p class="text-red-500">Error connecting to server: ${error.message}</p>`;
                clearMap();
            }
        }

        function clearMap() {
            if (currentPathLayer) {
                map.removeLayer(currentPathLayer);
                currentPathLayer = null;
            }
            if (sourceMarker) {
                map.removeLayer(sourceMarker);
                sourceMarker = null;
            }
            if (destinationMarker) {
                map.removeLayer(destinationMarker);
                destinationMarker = null;
            }
            distanceLabels.forEach(label => map.removeLayer(label));
            distanceLabels = [];
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.input-container')) {
                document.getElementById('source-suggestions').classList.add('hidden');
                document.getElementById('destination-suggestions').classList.add('hidden');
            }
        });
    </script>
</body>
</html>
