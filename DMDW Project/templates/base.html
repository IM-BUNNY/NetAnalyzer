<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Road Accident Severity Prediction — DMDW Project using ML and Data Warehousing">
  <title>{% block title %}Road Accident Predictor{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚦</text></svg>">
</head>
<body>

  <!-- Sidebar Navigation -->
  <nav class="sidebar">
    <div class="sidebar-logo">🚦</div>
    <div class="sidebar-nav">
      <a href="/" class="nav-item {% if active_page == 'dashboard' %}active{% endif %}" id="nav-dashboard">
        📊<span class="tooltip">Dashboard</span>
      </a>
      <a href="/predict" class="nav-item {% if active_page == 'predict' %}active{% endif %}" id="nav-predict">
        🔮<span class="tooltip">Predict</span>
      </a>
      <a href="/eda" class="nav-item {% if active_page == 'eda' %}active{% endif %}" id="nav-eda">
        📈<span class="tooltip">EDA</span>
      </a>
      <a href="/warehouse" class="nav-item {% if active_page == 'warehouse' %}active{% endif %}" id="nav-warehouse">
        🏭<span class="tooltip">Warehouse</span>
      </a>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  <script src="/static/js/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
