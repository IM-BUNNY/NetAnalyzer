{% extends "base.html" %}
{% set active_page = 'eda' %}
{% block title %}EDA — Road Accident Predictor{% endblock %}

{% block content %}
<div class="page-header">
  <h1>📈 Exploratory Data Analysis</h1>
  <p>Visual insights from the UK Road Accident dataset</p>
</div>

<div class="eda-grid" id="edaGrid">
  <div class="glass-card" style="text-align:center;padding:60px">
    <div class="spinner" style="display:inline-block;width:30px;height:30px;margin-bottom:12px"></div>
    <p style="color:var(--text-muted)">Loading visualizations...</p>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', () => {
  fetch('/api/eda/plots')
    .then(r => r.json())
    .then(plots => {
      const grid = document.getElementById('edaGrid');
      if (!plots.length) {
        grid.innerHTML = '<div class="glass-card" style="text-align:center;padding:40px"><p style="color:var(--text-muted)">No plots found. Run eda.py first.</p></div>';
        return;
      }
      grid.innerHTML = plots.map(p => `
        <div class="eda-card">
          <img src="${p.data}" alt="${p.title}" loading="lazy">
          <div class="eda-title">${p.title}</div>
        </div>
      `).join('');
    });
});
</script>
{% endblock %}
